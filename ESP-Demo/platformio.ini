[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
    bblanchon/ArduinoJson@6.21.5
build_flags =
    -D CORE_DEBUG_LEVEL=1

[env:esp32dev]
board = esp32dev

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
